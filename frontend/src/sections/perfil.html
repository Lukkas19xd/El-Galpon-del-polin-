<section id="seccion-perfil" class="hidden">
  <h2 class="mb-6 border-b-4 border-madera pb-4 text-2xl font-bold text-bosque">Mi perfil</h2>
  <div class="grid grid-cols-1 gap-8 md:grid-cols-2">
    <div class="rounded-md bg-neutral-50 p-6">
      <h3 class="mb-4 text-lg font-bold text-bosque">Mis datos</h3>
      <form id="formPerfil" onsubmit="handleActualizarPerfil(event)" class="space-y-5">
        <div>
          <label for="perfilNombre" class="mb-1 block text-sm font-semibold text-neutral-700">Nombre</label>
          <input type="text" id="perfilNombre" required maxlength="100" autocomplete="name" class="w-full rounded-md border border-neutral-300 px-3 py-2">
        </div>
        <div>
          <label for="perfilEmail" class="mb-1 block text-sm font-semibold text-neutral-700">Email</label>
          <input type="email" id="perfilEmail" disabled class="w-full rounded-md border border-neutral-200 bg-neutral-100 px-3 py-2 text-neutral-500">
        </div>
        <div>
          <label for="perfilTelefono" class="mb-1 block text-sm font-semibold text-neutral-700">Teléfono</label>
          <input type="tel" id="perfilTelefono" autocomplete="tel" placeholder="+56 9 1234 5678" pattern="[0-9+\s\(\)\-]{6,20}" class="w-full rounded-md border border-neutral-300 px-3 py-2">
        </div>
        <div>
          <label for="perfilDireccion" class="mb-1 block text-sm font-semibold text-neutral-700">Dirección</label>
          <input type="text" id="perfilDireccion" maxlength="200" autocomplete="street-address" class="w-full rounded-md border border-neutral-300 px-3 py-2">
        </div>
        <div>
          <label for="perfilCiudad" class="mb-1 block text-sm font-semibold text-neutral-700">Ciudad</label>
          <input type="text" id="perfilCiudad" maxlength="100" autocomplete="address-level2" class="w-full rounded-md border border-neutral-300 px-3 py-2">
        </div>
        <button type="submit" class="w-full rounded-md bg-madera px-6 py-3 font-bold text-white shadow hover:bg-madera-claro disabled:cursor-wait disabled:opacity-60">Guardar cambios</button>
      </form>
    </div>
    <div class="rounded-md bg-neutral-50 p-6">
      <h3 class="mb-4 text-lg font-bold text-bosque">Cambiar contraseña</h3>
      <form id="formContrasena" onsubmit="handleCambiarContrasena(event)" class="space-y-5">
        <div>
          <label for="contrasenaActual" class="mb-1 block text-sm font-semibold text-neutral-700">Contraseña actual</label>
          <input type="password" id="contrasenaActual" required autocomplete="current-password" class="w-full rounded-md border border-neutral-300 px-3 py-2">
        </div>
        <div>
          <label for="contrasenaNueva" class="mb-1 block text-sm font-semibold text-neutral-700">Contraseña nueva</label>
          <input type="password" id="contrasenaNueva" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres" class="w-full rounded-md border border-neutral-300 px-3 py-2">
        </div>
        <div>
          <label for="contrasenaConfirmacion" class="mb-1 block text-sm font-semibold text-neutral-700">Repite la contraseña nueva</label>
          <input type="password" id="contrasenaConfirmacion" required minlength="8" autocomplete="new-password" class="w-full rounded-md border border-neutral-300 px-3 py-2">
        </div>
        <button type="submit" class="w-full rounded-md bg-bosque px-6 py-3 font-bold text-white shadow hover:bg-bosque-claro disabled:cursor-wait disabled:opacity-60">Cambiar contraseña</button>
      </form>
    </div>
  </div>
</section>
