<section id="seccion-productos" class="hidden">
  <div class="mb-8">
    <span class="mb-5 block h-1 w-12 rounded-full bg-oro" aria-hidden="true"></span>
    <h2 class="mb-2 text-3xl font-bold text-[#F7F1E8] sm:text-4xl">Catálogo</h2>
    <p class="text-white/60">Polines y leña disponibles para reservar. Pagas al retirar en el galpón.</p>
  </div>
  <!-- Los filtros quedan en la dirección (#/productos?categoria=lena&q=...) para poder compartir el enlace -->
  <form class="campo-oscuro mb-6 grid grid-cols-1 gap-3 sm:grid-cols-[1fr_auto_auto]" role="search" onsubmit="event.preventDefault(); aplicarFiltros()">
    <label for="busquedaProducto" class="sr-only">Buscar productos</label>
    <input type="search" id="busquedaProducto" enterkeyhint="search" oninput="buscarConPausa()" placeholder="Buscar: eucalipto, 3 metros, astillas…"
           class="rounded-full border border-white/10 bg-carbon px-5 py-3 text-hueso placeholder:text-white/40 focus:border-oro/60 focus:outline-none">
    <label for="filtroTipo" class="sr-only">Tipo</label>
    <select id="filtroTipo" onchange="aplicarFiltros()" class="rounded-full border border-white/10 bg-carbon px-5 py-3 text-hueso focus:border-oro/60 focus:outline-none">
      <option value="">Todos los tipos</option>
      <option value="impregnado">Impregnado</option>
      <option value="estandar">Estándar</option>
      <option value="lena">Leña</option>
    </select>
    <label for="filtroCategoria" class="sr-only">Categoría</label>
    <select id="filtroCategoria" onchange="aplicarFiltros()" class="rounded-full border border-white/10 bg-carbon px-5 py-3 text-hueso focus:border-oro/60 focus:outline-none">
      <option value="">Todas las categorías</option>
      <option value="industrial">Industrial</option>
      <option value="construccion">Construcción</option>
      <option value="agricola">Agrícola</option>
      <option value="lena">Leña en saco</option>
    </select>
  </form>
  <p id="productosResumen" class="mb-4 text-sm text-white/50" aria-live="polite"></p>
  <div id="productosGrid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4"></div>
</section>
