<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Galpón del Polín - Venta de Polines</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            madera: { DEFAULT: '#8B5A3C', claro: '#A0644E', oscuro: '#6B4226' },
            bosque: { DEFAULT: '#2D5F3F', claro: '#3A7A4F', oscuro: '#163D27', noche: '#0F2A1B' }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-neutral-100 text-neutral-900">
  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-bosque text-white shadow-md">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-6 py-4">
      <div class="flex items-center gap-2 text-xl font-bold">
        <span class="text-3xl">📦</span>
        <span>El Galpón del Polín</span>
      </div>
      <ul class="flex flex-wrap items-center gap-2 text-sm font-medium sm:gap-4 sm:text-base">
        <li><a href="#" onclick="cambiarVista('inicio')" class="rounded px-3 py-2 hover:bg-white/10">Inicio</a></li>
        <li><a href="#" onclick="cambiarVista('productos')" class="rounded px-3 py-2 hover:bg-white/10">Productos</a></li>
        <li>
          <a href="#" onclick="cambiarVista('carrito')" class="rounded px-3 py-2 hover:bg-white/10">
            Carrito <span id="carritoContador" class="ml-1 inline-flex h-5 w-5 items-center justify-center rounded-full bg-madera text-xs font-bold">0</span>
          </a>
        </li>
        <li id="menuDashboard" style="display:none;"><a href="#" onclick="cambiarVista('dashboard')" class="rounded px-3 py-2 hover:bg-white/10">Dashboard</a></li>
        <li id="menuMisReservas" style="display:none;"><a href="#" onclick="cambiarVista('mis-reservas')" class="rounded px-3 py-2 hover:bg-white/10">Mis Reservas</a></li>
        <li id="menuPerfil" style="display:none;"><a href="#" onclick="cambiarVista('perfil')" class="rounded px-3 py-2 hover:bg-white/10">Perfil</a></li>
        <li id="menuAdmin" style="display:none;"><a href="#" onclick="cambiarVista('admin')" class="rounded px-3 py-2 hover:bg-white/10">Administrador</a></li>
        <li id="btnLogin">
          <a href="#" onclick="cambiarVista('login')" class="rounded bg-madera px-4 py-2 font-bold hover:bg-madera-claro">Iniciar Sesión</a>
        </li>
        <li id="btnLogout" style="display:none;">
          <a href="#" onclick="cerrarSesion()" class="rounded bg-madera px-4 py-2 font-bold hover:bg-madera-claro">Cerrar Sesión</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Main Content: cada vista se carga dinámicamente desde src/sections/ (ver src/js/cargarSecciones.js) -->
  <main id="main-content" class="mx-auto max-w-6xl space-y-16 px-4 py-10">
    <p class="text-center text-neutral-400">Cargando...</p>
  </main>

  <!-- Modal para detalles -->
  <div id="modal" class="fixed inset-0 z-[100] hidden bg-black/40">
    <div class="mx-auto mt-16 w-[90%] max-w-lg rounded-lg bg-white p-8 shadow-2xl">
      <span class="float-right cursor-pointer text-2xl font-bold text-neutral-400 hover:text-neutral-900" onclick="cerrarModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="src/js/cargarSecciones.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
